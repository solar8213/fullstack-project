<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Наша команда</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Наша команда</h1>

        <div class="tabs">
            <button class="tab-btn active" data-target="team">Команда</button>
            <button class="tab-btn" data-target="member-1">Участник 1</button>
            <button class="tab-btn" data-target="member-2">Участник 2</button>
            <button class="tab-btn" data-target="member-3">Участник 3</button>
            <button class="tab-btn" data-target="member-4">Участник 4</button>
            <button class="tab-btn" data-target="task1">Task 1</button>
            <button class="tab-btn" data-target="task2">Task 2</button>
        </div>

        <div id="team" class="card team-card">
            <div class="team-member" data-target="member-1">

                <img src="image/member1.jpg" alt="Кирилл">
                <span class="team-name">Кирилл</span>
                <span class="team-role">Team Lead</span>
            </div>

            <div class="team-member" data-target="member-2">
                <img src="image/member2.jpg" alt="Никита">
                <span class="team-name">Никита</span>
                <span class="team-role">Backend</span>
            </div>

            <div class="team-member" data-target="member-3">
                <img src="image/member3.jpeg" alt="Лаура">
                <span class="team-name">Лаура</span>
                <span class="team-role">Frontend</span>
            </div>

            <div class="team-member" data-target="member-4">
                <img src="image/member4.jpeg" alt="Илияс">
                <span class="team-name">Илияс</span>
                <span class="team-role">Frontend</span>
            </div>
        </div>

        <div id="task1" class="card hidden">
            <div class="card-info">
                <h2>Task 1: работа с DOM</h2>

                <h3 id="target-title">Этот заголовок будет изменён</h3>
                <button id="btn-change-text" class="task-btn">Изменить текст</button>

                <p class="old-element" id="old-element-demo">Этот абзац с классом old-element — можно удалить кнопкой ниже.</p>
                <button id="btn-remove-old" class="task-btn">Удалить элемент</button>

                <div id="task1-output"></div>
                <button id="btn-create-div" class="task-btn">Создать элемент</button>
                <button id="btn-create-paragraph" class="task-btn">Создать абзац</button>
            </div>
        </div>
        <div id="task2" class="card hidden">
            <div class="card-info">
                <h2>Task 2: управление классами</h2>
                <div id="demo-box" class="demo-box">
                    Дважды кликните по этому блоку
                </div>
            </div>
        </div>

    </main>

    </main>

    <script src="js/script.js"></script>
  </body>
</html>
